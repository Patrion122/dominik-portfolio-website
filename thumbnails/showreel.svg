<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="640" y1="0" x2="640" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a1830"/>
      <stop offset="0.5" stop-color="#071222"/>
      <stop offset="1" stop-color="#02050c"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 360) rotate(90) scale(380 220)">
      <stop stop-color="#4d9fff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#2f7fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#2f7fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 80) rotate(90) scale(420 520)">
      <stop stop-color="#4d9fff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#4d9fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect width="1280" height="720" fill="url(#centerGlow)"/>

  <rect x="1" y="1" width="1278" height="718" stroke="#4d9fff" stroke-width="2" opacity="0.45"/>
  <rect x="0.5" y="0.5" width="1279" height="719" stroke="#222222" stroke-width="1"/>

  <line x1="96" y1="360" x2="1184" y2="360" stroke="#4d9fff" stroke-width="1" opacity="0.18"/>

  <text
    x="640"
    y="378"
    text-anchor="middle"
    fill="#4d9fff"
    font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
    font-size="132"
    font-weight="700"
    letter-spacing="0.1em"
    opacity="0.22"
    filter="url(#textGlow)"
  >SHOWREEL</text>

  <text
    x="640"
    y="378"
    text-anchor="middle"
    fill="#ffffff"
    font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
    font-size="132"
    font-weight="700"
    letter-spacing="0.1em"
  >SHOWREEL</text>

  <line x1="360" y1="418" x2="920" y2="418" stroke="#4d9fff" stroke-width="2" opacity="0.85"/>
</svg>
